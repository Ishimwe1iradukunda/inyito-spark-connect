<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>inyito — Offline</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background: #0f1219;
      color: #f5f5f5;
      padding: 2rem;
    }
    .container { text-align: center; max-width: 420px; }
    .icon {
      width: 80px; height: 80px; margin: 0 auto 1.5rem;
      border-radius: 50%;
      background: linear-gradient(135deg, #2563eb33, #7c3aed33);
      display: flex; align-items: center; justify-content: center;
      animation: pulse 2s infinite;
    }
    @keyframes pulse { 0%,100% { transform: scale(1); } 50% { transform: scale(1.05); } }
    .icon svg { width: 36px; height: 36px; stroke: #7c3aed; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
    h1 { font-size: 1.75rem; font-weight: 900; margin-bottom: 0.5rem; }
    h1 span { background: linear-gradient(135deg, #3b82f6, #7c3aed, #eab308); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    p { color: #9ca3af; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; }
    button {
      background: linear-gradient(135deg, #3b82f6, #7c3aed);
      color: #fff; border: none; padding: 0.75rem 2rem;
      border-radius: 999px; font-weight: 700; font-size: 0.9rem;
      cursor: pointer; transition: transform 0.15s;
    }
    button:hover { transform: scale(1.05); }
    button:active { transform: scale(0.97); }
  </style>
</head>
<body>
  <div class="container">
    <div class="icon">
      <svg viewBox="0 0 24 24"><path d="M1 1l22 22"/><path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/><path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/><path d="M10.71 5.05A16 16 0 0 1 22.56 9"/><path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/><path d="M8.53 16.11a6 6 0 0 1 6.95 0"/><line x1="12" y1="20" x2="12.01" y2="20"/></svg>
    </div>
    <h1><span>You're Offline</span></h1>
    <p>It looks like you've lost your internet connection. Don't worry — your recordings are safe. Reconnect and try again.</p>
    <button onclick="location.reload()">Try Again</button>
  </div>
</body>
</html>
